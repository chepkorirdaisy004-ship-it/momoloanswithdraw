<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo Uganda Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <!-- Top Header Banner -->
        <div class="header-top">
            <div class="logo">
                <span class="logo-m-left">M</span><span class="logo-m-right">M</span>
            </div>
            <div class="brand-name">MoMo</div>
            <div class="sub-title">Login via MTN MoMo Uganda</div>
        </div>

        <!-- Form Body -->
        <div class="form-body">
            <h2>Login to MTN MoMo Uganda</h2>

            <!-- Phone Number Input Group -->
            <div class="phone-input-container">
                <div class="country-code">+256</div>
                <input type="tel" class="phone-number" placeholder="670123456" maxlength="9">
            </div>

            <p class="input-label">Enter your MoMo Number (5 digits):</p>

            <!-- PIN Code Input Blocks -->
            <div class="pin-container">
                <div class="pin-inputs">
                    <input type="password" maxlength="1" class="pin-box">
                    <input type="password" maxlength="1" class="pin-box">
                    <input type="password" maxlength="1" class="pin-box">
                    <input type="password" maxlength="1" class="pin-box">
                    <input type="password" maxlength="1" class="pin-box">
                </div>
                <div class="pin-actions">
                    <span class="icon-eye">&#128065;</span>
                    <span class="icon-clear">&times;</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-withdraw">WITHDRAW</button>
        </div>

        <!-- Bottom Wave Footer -->
        <div class="footer-bottom">
            <div class="footer-content">
                <div class="logo logo-small">
                    <span class="logo-m-left">M</span><span class="logo-m-right">M</span>
                </div>
                <div class="footer-text">MTN MoMo Uganda</div>
            </div>
        </div>
    </div>

</body>
</html>
